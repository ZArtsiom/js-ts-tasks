<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML CSS Task</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./iphone.js"></script>
  </head>
  <body>
    <iphone-frame>
      <div class="iphone-frame">
        <div class="profile-header">
          <div class="profile-info">
            <img src="profile.jpg" alt="Profile Photo" class="profile-photo">
            <div class="user-stats">
              <p>129 Posts</p>
              <p>3680 Followers</p>
              <p>230 Following</p>
            </div>
          </div>
          <div class="user-details">
            <h2>Full Name</h2>
            <p>Local Business</p>
            <a href="http://www.website.com" target="_blank">www.website.com</a>
          </div>
          <div class="action-buttons">
            <button>Follow</button>
            <button>Message</button>
            <button>Email</button>
          </div>
        </div>
        
        <!-- Story Highlights -->
        <div class="story-highlights">
          <img src="story1.jpg" alt="Story 1" class="story">
          <img src="story2.jpg" alt="Story 2" class="story">
          <!-- More stories -->
        </div>
        
        <!-- Image Gallery -->
        <div class="gallery">
          <img src="image1.jpg" alt="Image 1">
          <img src="image2.jpg" alt="Image 2">
          <!-- More images -->
        </div>
        
        <!-- Navigation Icons -->
        <div class="nav-icons">
          <a href="#">Home</a>
          <a href="#">Search</a>
          <a href="#">Notifications</a>
          <!-- More icons -->
        </div>
      </div>
    </iphone-frame>
  </body>
</html>
