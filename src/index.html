<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iphone-frame">
        <div class="profile-container">
            <div class="user-name">user_name</div>
            <div class="profile-header">
                <div class="profile-photo">
                    <img src="Logo.png" alt="Profile Photo">
                </div>
                <div class="stats">
                    <div class="stat-item">129<br>Posts</div>
                    <div class="stat-item">3680<br>Followers</div>
                    <div class="stat-item">230<br>Following</div>
                </div>
            </div>
            <div class="profile-info">
                <div class="name">Name</div>
                <div class="business">Local business</div>
                <div class="website">www.website.com</div>
            </div>
            <div class="profile-actions">
                <button class="action-btn follow">Follow</button>
                <button class="action-btn">Message</button>
                <button class="action-btn">Email</button>
            </div>
            <div class="highlights">
                <div class="highlight">
                    <img src="Highlight 1.png" alt="Highlight 1">
                    <span>Highlight</span>
                </div>
                <div class="highlight">
                    <img src="Highlight 2.png" alt="Highlight 2">
                    <span>Highlight</span>
                </div>
                <div class="highlight">
                    <img src="Highlight 3.png" alt="Highlight 3">
                    <span>Highlight</span>
                </div>
                <div class="highlight">
                    <img src="Highlight 4.png" alt="Highlight 4">
                    <span>Highlight</span>
                </div>
            </div>
            <div class="gallery">
                <!-- Add image elements here -->
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
                <div class="gallery-item"></div>
            </div>
            <div class="navigation">
                <!-- Add navigation icons here -->
                <div class="nav-icon">🏠</div>
                <div class="nav-icon">🔍</div>
                <div class="nav-icon">➕</div>
                <div class="nav-icon">❤️</div>
                <div class="nav-icon">👤</div>
            </div>
        </div>
    </div>
</body>
</html>
